# Grafana 데이터 소스(파일 프로비저닝, 플랜 결정11). UI에서 고쳐도 재기동하면 이 파일로 돌아간다.
# 이동 경로: Loki 로그의 trace_id → Tempo trace, Tempo span → 같은 trace_id의 Loki 로그.
# 이 파일에서 $는 환경 변수 치환 기호라 Grafana 변수는 $$로 적는다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Tempo에서 추적 보기

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
      nodeGraph:
        enabled: true
