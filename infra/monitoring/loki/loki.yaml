# Loki 단일 바이너리 로컬 설정(파일시스템 저장). 보관 7일(플랜 결정9): compactor가 보관 기간이 지난 청크를 지운다.
# 라벨은 service·env·version·level만 쓴다. trace_id·span_id는 라벨이 아니라 structured metadata로 받는다(플랜 결정6).

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  # 로그 삭제 API를 끈다. 경우 2에서 3100은 backend 호스트에 열리므로, 그쪽에서 로그를 지울 수 없게 한다.
  # 보관 기간에 따른 삭제(compactor retention)는 이 설정과 무관하게 동작한다
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
