# 모니터링 서버 쪽: Prometheus·Loki·Tempo가 backend 쪽 Alloy가 보낸 데이터를 받아 저장하고, Grafana로 조회한다.
#   경우 1(같은 호스트): 기존 compose + monitoring-agent 파일 + 이 파일을 한 프로젝트로 띄운다
#   경우 2(별도 모니터링 서버): 이 파일만 -p kkugi-monitoring으로 띄우고, MONITORING_BIND_ADDR을 사설 IP로 바꾼다
# 수신 포트(Loki 3100, Tempo 4317, Prometheus 9090)는 MONITORING_BIND_ADDR에만 연다. Grafana는 127.0.0.1에만 연다.
# Loki 3100과 Prometheus 9090은 수신 전용이 아니다. 같은 포트로 조회 API도 열리고 인증이 없다. 그래서 경우 2에서는
# 사설 망과 보안 그룹(backend 호스트만 허용)을 전제로 한다. Loki의 삭제 API는 loki.yaml에서 끈다.
# 이 파일은 infra/monitoring/ 아래 설정 파일과 함께 쓴다(저장소를 받아서 실행한다). 없으면 container 생성에서 멈춘다.
# 이미지 버전은 고정한다. 보관: Prometheus 14일, Loki·Tempo 7일.

services:
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - type: bind
        source: ./monitoring/loki/loki.yaml
        target: /etc/loki/loki.yaml
        read_only: true
        bind:
          create_host_path: false
      - loki-data:/loki
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${LOKI_HOST_PORT:-3100}:3100"

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - type: bind
        source: ./monitoring/tempo/tempo.yaml
        target: /etc/tempo/tempo.yaml
        read_only: true
        bind:
          create_host_path: false
      - tempo-data:/var/tempo
    ports:
      # 4317은 Alloy가 trace를 보내는 OTLP gRPC, 3200은 조회 API다
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${TEMPO_OTLP_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      # backend 쪽 Alloy가 metric을 /api/v1/write로 보낸다(push). Prometheus는 직접 수집하지 않는다
      - --web.enable-remote-write-receiver
    volumes:
      - type: bind
        source: ./monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?infra/.env에 GRAFANA_ADMIN_USER를 넣으세요}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?infra/.env에 GRAFANA_ADMIN_PASSWORD를 넣으세요}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - type: bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
