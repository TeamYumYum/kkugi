# 냠냠코치 로컬 통합 실행(plan.md 5.1). 저장소 루트에서:
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# 값은 모두 infra/.env(커밋 금지)에서 치환한다. 목록은 infra/.env.example.
# 필수 변수는 `${VAR:?...}`로 두어 비어 있으면 compose가 바로 멈춘다(docs/secret-environment-variables.md 6장).
# 외부에 여는 포트는 nginx 하나다. 나머지는 개발 편의를 위해 127.0.0.1에만 묶는다.

name: nyamnyam

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env에 MYSQL_ROOT_PASSWORD를 넣으세요}
      MYSQL_DATABASE: ${DB_NAME:?infra/.env에 DB_NAME을 넣으세요}
      MYSQL_USER: ${DB_USERNAME:?infra/.env에 DB_USERNAME을 넣으세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?infra/.env에 DB_PASSWORD를 넣으세요}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?infra/.env에 REDIS_PASSWORD를 넣으세요}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 실험 추적 + 모델 레지스트리(ADR-11). 백엔드 스토어는 SQLite, 아티팩트는 볼륨.
  # --serve-artifacts로 아티팩트도 MLflow 서버를 거쳐 오가므로 ai·ml이 볼륨을 공유하지 않아도 된다.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"

  backend:
    build: ../backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: "8080"
      # 결정 필요: backend가 FastAPI 주소를 읽을 변수 이름(infrastructure/ai 담당과 합의)
      AI_BASE_URL: http://ai:8000
      TZ: Asia/Seoul

  ai:
    build: ../ai
    depends_on:
      # 레지스트리가 아직 안 떠도 ai는 로컬 캐시로 기동한다(ADR-11 폴백). 순서만 맞춘다.
      mlflow:
        condition: service_started
    environment:
      CLAUDE_MOCK: ${CLAUDE_MOCK:-true}
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-}
      VISION_MODEL_STAGE: ${VISION_MODEL_STAGE:-}
      MODEL_CACHE_DIR: /app/model-cache
    volumes:
      - ai-model-cache:/app/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ai/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 웹 정적 빌드 서빙 + /api 프록시. 먼저 `npm --prefix web run build`로 web/dist를 만든다.
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_HOST_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
  mlflow-data:
  ai-model-cache:
