# 최소 관측 환경 overlay(지표·로그·추적). 기존 compose에 -f로 겹칠 때만 켜진다. 저장소 루트에서:
#   sh infra/monitoring/otel/download-agent.sh
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.observability.yml --env-file infra/.env up -d --build
# 경로: 지표 backend:8081 ← Prometheus scrape / 로그 Docker → Alloy → Loki / 추적 agent → Alloy → Tempo
# 관측 포트는 모두 127.0.0.1에만 연다. 이미지 버전은 고정한다. 보관: Prometheus 14일, Loki·Tempo 7일.

services:
  # backend에 OTel Java Agent를 붙인다. 이 overlay를 빼면 agent 없이 뜬다.
  # agent는 추적만 보낸다(지표는 Prometheus scrape, 로그는 Docker 로그 → Alloy).
  backend:
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: kkugi-backend
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${APP_ENV:-local},service.version=${APP_VERSION:-dev}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # SQL 리터럴을 ?로 바꾼다(기본값이지만 명시한다). 요청·응답 헤더는 기본으로 수집하지 않는다
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
    volumes:
      # jar가 없으면 Docker가 그 자리에 빈 디렉터리를 만들고 JVM이 기동에 실패한다. 없으면 compose가 바로 멈추게 한다
      - type: bind
        source: ./monitoring/otel/opentelemetry-javaagent.jar
        target: /otel/opentelemetry-javaagent.jar
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker 로그 수집용. :ro여도 Docker API 권한은 줄지 않아 호스트 권한에 준한다. 로컬에서만 쓴다(플랜 미정6)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?infra/.env에 GRAFANA_ADMIN_USER를 넣으세요}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?infra/.env에 GRAFANA_ADMIN_PASSWORD를 넣으세요}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  alloy-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
