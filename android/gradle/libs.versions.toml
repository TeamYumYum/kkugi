# 냠냠코치 Android 버전 카탈로그. 버전은 ai-dev-harness 리허설 fixture(키트 CI에서 실제 빌드가 통과한 조합)를 따른다
# 버전을 올리면 엄격 판정(harness.json judge.trigger_paths.strict)이다
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
# KSP는 Kotlin 버전에 맞춘다(<kotlin>-<ksp>)
ksp = "2.2.21-2.0.5"
# 2.59부터 Hilt Gradle 플러그인이 AGP 9를 요구한다. AGP 8을 쓰는 동안 2.57.x에 둔다
hilt = "2.57.2"
# androidx.hilt(hiltViewModel). 버전 키를 hilt-…로 두면 hilt 키와 접근자가 겹친다
androidx-hilt = "1.3.0"
# 플러그인과 CLI 버전 키를 ktlint·ktlint-gradle로 두면 접근자가 겹친다
ktlint-gradle = "13.0.0"
ktlint-cli = "1.5.0"
compose-bom = "2025.10.01"
activity-compose = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.5"
wear-compose = "1.5.4"
coroutines = "1.10.2"
# :core의 네트워크(ADR-05·ADR-09)와 Room(ADR-03: Workout 테이블만)
retrofit = "2.11.0"
room = "2.8.3"
konsist = "0.17.3"
junit = "4.13.2"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
androidx-wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wear-compose" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
